# Global name overrides for all resources
nameOverride: ""
fullnameOverride: ""
enablePrometheusStack: true
automountServiceAccountToken: true
globalConfig:
  custom_annotations: {}
  # Prometheus URL the runner queries (e.g. "http://prometheus-server.prometheus.svc:80").
  # Surfaces as PROMETHEUS_URL on the runner pod. Leave empty to let the agent auto-discover.
  prometheus_url: ""
  # Optional headers (comma-separated "Header: value" pairs). Surfaces as PROMETHEUS_HEADERS.
  prometheus_headers: ""
  # Optional labels appended to every PromQL query (legacy multi-cluster parity).
  # A YAML map, e.g. {k8s_cluster: aws-prod}. Surfaces as PROMETHEUS_ADDITIONAL_LABELS
  # in the "key=value,key=value" form the runner expects.
  prometheus_additional_labels: {}
enableServiceMonitors: true
# parameters for the nudgebee forwarder deployment
kubewatch:
  image:
    repository: ghcr.io/nudgebee/kubewatch
    tag: 2.14.1-nb.2
  imagePullPolicy: IfNotPresent
  pprof: true
  resources:
    requests:
      cpu: 10m
      memory: 512Mi
    limits:
      cpu: ~
  additional_env_vars: []
  tolerations: []
  annotations: {}
  nodeSelector: ~
  imagePullSecrets: []
  config:
    namespace: ""
    resource:
      deployment: true
      replicationcontroller: false # 0.10.12 disabled because not supported on the runner
      replicaset: true
      daemonset: true
      statefulset: true
      services: true
      pod: true
      job: true
      node: true
      hpa: true
      clusterrole: true
      clusterrolebinding: true
      serviceaccount: true
      persistentvolume: true
      namespace: true
      configmap: true # 0.9.17
      secret: false # disabled for security reasons
      event: true # updated on kubewatch 2.5
      coreevent: false # added on kubewatch 2.5
      ingress: true # full support on kubewatch 2.4 (earlier versions have ingress bugs)
      rollout: true
# parameters for the nudgebee runner service account
runnerServiceAccount:
  # image pull secrets added to the runner service account. Any pod using the service account will get those
  imagePullSecrets: []
# parameters for the nudgebee runner
runner:
  image:
    repository: ghcr.io/nudgebee/nudgebee-agent
    tag: 2026-08-31T07-13-00_d4e0a904755d31152007fc54471ceb25d605136f
  # Image template the pod_profiler action launches debugger pods from.
  # The agent substitutes `{}` for the variant (bpf, jvm, python, perf, ruby).
  # Surfaces as PROFILER_IMAGE; leave empty to fall back to the binary default.
  profilerImage: "ghcr.io/nudgebee/application-profiler-{}:4f4b455"
  imagePullPolicy: IfNotPresent
  # Expose net/http/pprof on the runner HTTP listener (surfaces as
  # PPROF_ENABLED). Off by default — the endpoints are unauthenticated;
  # enable only for active memory/CPU debugging.
  pprof: false
  resources:
    requests:
      cpu: 250m
      memory: 1000Mi
    limits:
      cpu: ~
      # Memory limit caps a runaway informer cache on large clusters.
      # 2000Mi is generous headroom for small/medium clusters. SIZING: large
      # clusters need more — budget ~1Gi per ~50k watched objects:
      #   <100 nodes / <10k workloads   : 2000Mi
      #   ~500 nodes / ~50k workloads   : 4000Mi
      #   ~1000 nodes / ~100k workloads : 6000Mi+  (and enable runner.scaling below)
      memory: 2000Mi
  # GOMEMLIMIT is derived from resources.limits.memory above and injected into
  # the runner container, so the Go GC knows about the cgroup ceiling instead of
  # discovering it via SIGKILL. Without it a transient allocation burst (large
  # Prometheus/Loki/ClickHouse responses are read whole before being decoded) can
  # outrun the collector and OOM the pod while the live heap is still small —
  # which is why OOMKills show up even on tiny clusters where the sizing table
  # above says there is plenty of headroom.
  #
  # goMemLimitRatio is the fraction of the memory limit handed to the Go heap;
  # the remainder covers non-heap RSS. Lower it if the pod still OOMs, raise it
  # to trade OOM-safety margin for less GC CPU.
  goMemLimitRatio: 0.8
  # Explicit GOMEMLIMIT override; skips the derivation when non-empty. Accepts
  # the Go form (e.g. "1600MiB" or a plain byte count). Leave empty to derive.
  goMemLimit: ""
  # Liveness/readiness probes hit the always-on /healthz endpoint on :5000 so a
  # hung or restarting runner is detected and kept out of the Service.
  probes:
    enabled: true
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 6
  # Scalability tunables for large clusters. All optional — unset
  # keys fall back to the binary defaults. The wire-changing knobs
  # (snapshotBatching, incrementalBatchSize > 1, emitTombstones) require matching
  # collector support, which has shipped, so they are enabled by default.
  scaling:
    snapshotBatching: true # batch the full-load snapshot (needs collector batch reassembly)
    batchSize: 1000 # items per snapshot batch when snapshotBatching is on
    incrementalBatchSize: 100 # coalesce N informer events per incremental POST (>1 needs collector to iterate data)
    emitTombstones: true # emit deleted:true on delete (needs collector incremental-delete support)
  # forwardPoolSize: 64          # bound concurrent event-forward goroutines
  # relayHandlerPoolSize: 32     # bound concurrent inbound WS handler goroutines
  tolerations: []
  annotations: {}
  nodeSelector: ~
  # Enable write permissions for the runner service account.
  # Adds permissions for: node delete/drain, service management, secret updates,
  # ingress/networkpolicy writes, resource quotas, limit ranges, namespace creation,
  # statefulset scaling, workload creation, and rollout lifecycle management.
  enableWritePermissions: false
  # Read-only cluster access. When true the runner's ClusterRole is strictly
  # get/list/watch — no Secrets API access at all (not even read), no
  # pods/exec, no pod eviction, no node patch, no write verbs on any
  # cluster-scoped or cross-namespace resource. The writes the agent needs to
  # function are granted by a namespaced Role in the RELEASE NAMESPACE only:
  # scanner Jobs, script-runner pods/configmaps, in-namespace exec, and
  # PrometheusRule CRUD (so UI-managed alert rules keep working).
  #
  # What stops working in this mode (denied by the API server): remediation
  # actions on customer workloads (delete_pod, drain, cordon, rollout_restart,
  # scale, PVC ops), rightsizing APPLY (recommendations still compute),
  # exec/profiling/terminal into pods outside the release namespace, and
  # private-image scan pull-secret auto-copy. Helm release inventory is
  # unaffected (the Go runner does not read Helm secrets).
  #
  # Mutually exclusive with enableWritePermissions and
  # scannerAutoCopyPullSecrets — helm template fails if both are set.
  # The full read-only RBAC lives in a single reviewable file:
  # templates/runner-service-account-readonly.yaml.
  readOnly: false
  # Kill-switch for the runner's mutate subsystem (delete_pod, cordon,
  # rollout_restart, PrometheusRule CRUD, AlertManager silences, Loki rules).
  # Default is true so the light-action alert-rule path (driven by the UI)
  # works without extra configuration; the auth boundary lives in the runner,
  # not here. Set to false for a strictly read-only deployment where every
  # mutate action — light-action or not — is unregistered at startup.
  mutateEnabled: true
  # Let image scans pull private workload images by copying the scanned pod's
  # imagePullSecrets into the scanner namespace for the duration of the scan
  # Job. Off by default (least privilege): when off, the agent never reads or
  # copies registry credentials, and private-image scans rely on whatever pull
  # secrets the runner service account already carries
  # (runnerServiceAccount.imagePullSecrets). Enabling this also grants the
  # runner secret update/patch/delete in the release namespace (for GC of the
  # copies) — see runner-service-account.yaml.
  scannerAutoCopyPullSecrets: false
  customClusterRoleRules: []
  imagePullSecrets: []
  extraVolumes: []
  extraVolumeMounts: []
  relay_address: wss://relay.nudgebee.com/register
  clickhouse_enabled: true
  clickhouse_secret: ""
  prometheus:
    # Managed-provider auth for Prometheus-compatible backends. Leave empty
    # for in-cluster Prometheus / plain-header auth (use globalConfig.
    # prometheus_headers for a static Authorization header). Precedence:
    # AWS → Coralogix → Azure.
    auth:
      # Coralogix: surfaces as CORALOGIX_PROMETHEUS_TOKEN (sent as `token` header).
      coralogixToken: ""
      # AWS SigV4 (Amazon Managed Prometheus). accessKey+secretAccessKey required
      # together; serviceName defaults to "aps".
      awsAccessKey: ""
      awsSecretAccessKey: ""
      awsRegion: ""
      awsServiceName: ""
      # Azure AD (Azure Monitor managed Prometheus). Set azureUseManagedId
      # (any non-empty value) OR azureClientSecret; clientId + tenantId required.
      azureUseManagedId: ""
      azureClientId: ""
      azureClientSecret: ""
      azureTenantId: ""
      azureResource: ""
  loki:
    url: ""
    headers: ""
    # Optional HTTP Basic-Auth. Surfaces as LOKI_USERNAME / LOKI_PASSWORD.
    username: ""
    password: ""
  es:
    # ES as the logs provider is OPT-IN: set enabled: true AND url. Defaults off
    # (matching the prod chart) so a stray/leftover `url` never auto-selects ES
    # and masks an explicitly-configured provider like SigNoz. Surfaces as
    # ELASTICSEARCH_ENABLED / ELASTICSEARCH_URL.
    enabled: false
    url: ""
    apiKey: ""
    # Extra request headers, comma-separated "Key: Value" pairs (same form as
    # globalConfig.prometheus_headers). For OpenSearch-compatible services that
    # authenticate on a custom header instead of ApiKey or basic auth — Logz.io
    # uses X-API-TOKEN. Surfaces as ELASTICSEARCH_HEADERS.
    # e.g. "X-API-TOKEN: <token>"
    headers: ""
    # Verify the ES server's TLS certificate (https URLs only). Defaults off to
    # match the legacy client. Surfaces as ELASTICSEARCH_SSL_VERIFY.
    sslVerify: false
  signoz:
    # Set to enable SigNoz actions. Surfaces as SIGNOZ_URL.
    url: ""
    # Auth: either apiKey (SIGNOZ-API-KEY header) or user/password
    # (JWT via /api/v1/login). apiKey takes precedence when both are set.
    apiKey: ""
    user: ""
    password: ""
  jaeger:
    # In-cluster Jaeger query endpoint. Set when the account uses
    # traces=jaeger-via-agent so the agent can serve jaeger_query_* actions the
    # backend dispatches. Surfaces as JAEGER_QUERY_URL (the agent falls back to
    # it for JAEGER_URL). When empty, jaeger_query_* return a clear
    # "not configured" error instead of failing auth.
    queryUrl: ""
    # Optional Bearer token for the Jaeger query API. Surfaces as JAEGER_TOKEN.
    token: ""
  chronosphere:
    # Chronosphere endpoint for trace queries. Surfaces as CHRONOSPHERE_URL.
    # Empty → chronosphere_query_traces returns "not configured".
    url: ""
    apiKey: ""
    # Report Chronosphere as the traces provider (surfaces as
    # CHRONOSPHERE_TRACES_ENABLED). Defaults on when `url` is set, so
    # configuring the block "just works" for the Traces status; set false to
    # keep the query action but not surface Chronosphere traces.
    tracesEnabled: true
    # Optional explicit traces URL (CHRONOSPHERE_TRACES_URL). When empty the
    # agent falls back to prometheus_url if it points at chronosphere.io.
    tracesUrl: ""
  pinot:
    # Apache Pinot broker endpoint. Surfaces as PINOT_URL. Empty →
    # pinot_* actions return "not configured".
    url: ""
    authToken: ""
    username: ""
    password: ""
  grafana:
    url: ""
    username: ""
    password: ""
    extra_headers: ""
  additional_env_vars:
    - name: CLICKHOUSE_PORT
      value: "8123"
    - name: CLICKHOUSE_USER
      value: default
    - name: CLICKHOUSE_DB
      value: default
  nudgebee:
    endpoint: https://collector.nudgebee.com
    auth_secret_key: ""
    # Source NUDGEBEE_AUTH_SECRET_KEY from an existing Secret instead of
    # `auth_secret_key`. Set both `name` and `key`; setting this together with a
    # non-empty `auth_secret_key` is an error rather than a silent precedence
    # rule. Used when the credential is provisioned by something other than this
    # chart — e.g. a parent chart that generates it at install time — so the
    # runner Secret never has to carry it. Only this one variable moves; the rest
    # of the runner Secret is unchanged.
    # e.g. { name: nudgebee-local-agent, key: NUDGEBEE_AUTH_SECRET_KEY }
    authSecretKeyFrom: {}
    # Relay Ed25519 public key. Lets the agent verify relay-signed requests and
    # authorize UI-triggered workload mutations (delete/create/replace/restart/
    # scale). The UI install command populates this from the server's
    # SIGNING_PUBLIC_KEY. Empty = relay signatures ignored (mutations stay 401).
    relay_signing_public_key: ''
  serviceAccount:
    annotations: {}
nodeAgent:
  enabled: true
  podmonitor:
    enabled: true
    azuremanaged: false
    # Extra labels merged into the PodMonitor metadata. Set these to match the
    # Prometheus CR's podMonitorSelector, otherwise the operator ignores the
    # PodMonitor and no scrape target is created.
    # e.g. { pod-monitor: pod-monitor }
    additionalLabels: {}
    # Restrict which namespaces Prometheus looks in for matching pods.
    # Empty means the operator default (the PodMonitor's own namespace).
    # e.g. { matchNames: [ nudgebee ] } or { any: true }
    namespaceSelector: {}
  service:
    enabled: false
    annotations: {}
    labels: {}
  podAnnotations: {}
  image:
    repository: ghcr.io/nudgebee/node-agent
    pullPolicy: IfNotPresent
    tag: 0.1.5
  resources:
    requests:
      cpu: "100m"
      memory: "500Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""
  priorityClassName: ""
  logsEndpoint: ""
  profilesEndpoint: ""
  tracesEndpoint: "" # Will be set dynamically based on name overrides
  env:
    - name: SENSITIVE_HEADERS
      value: "Authorization,Proxy-Authorization,Cookie,Set-Cookie,X-Auth-Token,X-CSRF-Token,X-Session-ID,X-JWT-Token,X-Api-Key,X-Api-Token,X-Access-Token,X-Secret-Token,X-Refresh-Token,X-User-Token,X-Firebase-Auth,X-Google-Auth,X-Authorization,X-Wsse,X-WebService-Token,Authentication,Proxy-Authentication,X-Authentication-Token,X-Device-ID,X-Device-Token,X-Device-Key"
# OpenCost is disabled by default: cost is computed centrally on the server side.
# With opencost.enabled=false the agent ships no in-cluster OpenCost AND the runner
# stops discovering/polling cost (see OPENCOST_ENABLED), so the server detects cost
# is off and computes this cluster's allocations centrally (reaching its Prometheus
# via the relay). To run OpenCost per-cluster in the agent, set
# `--set opencost.enabled=true`.
opencost:
  enabled: false
  nameOverride: ""
  fullnameOverride: ""
  opencost:
    exporter:
      image:
        registry: ghcr.io
        repository: nudgebee/opencost
        tag: 1.114.0
    prometheus:
      external:
        url: ""
        enabled: true
      internal:
        enabled: false
      serviceMonitor:
        enabled: true
      defaultRules:
        create: true
    service:
      labels:
        app: opencost
    ui:
      enabled: false
rsa: ~
# custom parameters for OpenShift clusters
openshift:
  enabled: false
  createScc: true
  createPrivilegedScc: false
  privilegedSccName: null
  sccName: null
  sccPriority: null
  privilegedSccPriority: null
opentelemetry-collector:
  enabled: true
  image:
    repository: ghcr.io/nudgebee/opentelemetry-collector-contrib
    tag: 0.157.0
  # Inherit name overrides from parent chart
  nameOverride: ""
  fullnameOverride: ""
  resources:
    limits:
      memory: 1024Mi
    requests:
      cpu: 250m
      memory: 512Mi
  mode: deployment
  extraEnvs:
    - name: CLICKHOUSE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: "nudgebee-agent-clickhouse" # Default name, can be overridden
          key: admin-password
  ports:
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false
  config:
    processors:
      probabilistic_sampler:
        sampling_percentage: 10
      filter/drop_namespaces:
        error_mode: ignore
        traces:
          span:
            - attributes["k8s.namespace.name"] == "kube-system"
      filter/drop_health_check:
        error_mode: ignore
        traces:
          span:
            - attributes["http.route"] == "/health"
            - attributes["http.route"] == "/healthz"
            - attributes["http.route"] == "/live"
            - attributes["http.route"] == "/ready"
            - attributes["http.route"] == "/metrics"
            - attributes["http.target"] == "/health"
            - attributes["http.target"] == "/healthz"
            - attributes["http.target"] == "/live"
            - attributes["http.target"] == "/ready"
            - attributes["http.target"] == "/metrics"
            - attributes["url.path"] == "/health"
            - attributes["url.path"] == "/healthz"
            - attributes["url.path"] == "/live"
            - attributes["url.path"] == "/ready"
            - attributes["url.path"] == "/metrics"
      batch:
        timeout: 5s
        send_batch_size: 25000
    exporters:
      clickhouse:
        endpoint: "tcp://nudgebee-agent-clickhouse:9000?dial_timeout=10s&compress=lz4" # Default endpoint, can be overridden
        database: default
        ttl: 168h
        username: default
        password: ${env:CLICKHOUSE_PASSWORD}
        logs_table_name: otel_logs
        traces_table_name: otel_traces
        timeout: 5s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
    service:
      # memory_limiter must stay FIRST in every pipeline. The subchart defines the
      # processor (sized off resources.limits.memory) and puts it first in its own
      # default pipelines, but Helm REPLACES lists rather than merging them — so
      # every processor list we set here has to re-state it or the collector runs
      # with no admission backpressure and OOMKills under load.
      pipelines:
        traces:
          processors: [memory_limiter, filter/drop_namespaces, filter/drop_health_check, probabilistic_sampler, batch]
          exporters: [clickhouse]
          receivers: [otlp]
        logs:
          processors: [memory_limiter, batch]
          exporters: [clickhouse]
          receivers: [otlp]
        metrics:
          processors: [memory_limiter, batch]
          exporters: [clickhouse]
          receivers: [otlp]
clickhouse:
  enabled: true
  image:
    registry: ghcr.io
    repository: nudgebee/clickhouse
    tag: 24.12.4-debian-12-r0-nb-3
  nameOverride: ""
  fullnameOverride: ""
  persistence:
    size: 50Gi
  replicaCount: 1
  shards: 1
  zookeeper:
    enabled: false
  auth:
    username: default
    # Leave empty to let the Bitnami subchart auto-generate a random password
    # on first install (persisted in the `<release>-clickhouse` Secret under
    # key `admin-password`). To pin a value, set it here or pass via
    # `--set clickhouse.auth.password=...`.
    password: ""
  extraOverrides: "<clickhouse>\n  <asynchronous_metric_log remove=\"1\"/>\n  <metric_log remove=\"1\"/>\n  <query_log remove=\"1\" />\n  <query_thread_log remove=\"1\" />  \n  <query_views_log remove=\"1\" />\n  <part_log remove=\"1\"/>\n  <text_log remove=\"1\" />\n  <trace_log remove=\"1\"/>\n  <opentelemetry_span_log remove=\"1\"/>\n</clickhouse>\n"
  resources:
    requests:
      cpu: 100m
      memory: 2000Mi
    limits:
      memory: 2000Mi
  # NOTE: these render monitoring.coreos.com CRs from the Bitnami subchart, which
  # this chart cannot gate on `.Capabilities` the way its own templates do — a
  # parent cannot add a condition to a subchart's template, only flip a value. On
  # a cluster with no Prometheus operator the CRDs are unregistered and the
  # install fails on them, so installing there means setting BOTH:
  #   --set enablePrometheusStack=false \
  #   --set clickhouse.metrics.serviceMonitor.enabled=false
  # Left enabled by default so installs that do have the operator (the case the
  # quick-install script produces, since it installs kube-prometheus-stack) keep
  # their ClickHouse scrape target.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
    prometheusRule:
      enabled: true
      rules:
        - alert: ClickHouseInstanceDown
          expr: up{job="clickhouse"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "ClickHouse instance is down"
            description: "ClickHouse node is not responding for more than 2 minutes."
        - alert: ClickHouseHighLatency
          expr: rate(clickhouse_query_duration_seconds_sum[5m]) / rate(clickhouse_query_duration_seconds_count[5m]) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High query latency detected on ClickHouse"
            description: "Average query duration is above 1 second over last 5 minutes."
alertmanager:
  create_nb_default_rules: true
  # --------------------------------------------------------------------------
  # ROUTING ALERTS TO THIS AGENT
  # --------------------------------------------------------------------------
  # Alerts are the one input nothing verifies. Metrics are queried, so a bad
  # Prometheus URL shows up at once. Alerts are pushed: if no receiver targets
  # the agent, everything looks healthy and NudgeBee simply never raises an
  # event. Nothing in this chart can wire that for you -- it lives in your
  # Alertmanager's own configuration.
  #
  # The intake address is:
  #   http://<release>-runner.<agent-namespace>.svc/api/alerts
  # `helm install` prints the exact URL for your release. Use that, not the one
  # hardcoded in kube-prometheus-stack-values.yaml -- that file cannot template, so its
  # nudgebee-agent-runner.nudgebee-agent.svc resolves only when your release is
  # named exactly `nudgebee-agent` in a namespace of the same name. Anywhere
  # else, alerts are POSTed into a black hole and nothing logs an error.
  #
  # Add to the MAIN Alertmanager config (alertmanager.yml, or the equivalent
  # for whatever manages it -- kube-prometheus-stack's alertmanager.config
  # values, vmalertmanager, a plain Deployment):
  #
  #   route:
  #     routes:
  #       - receiver: nudgebee-agent
  #         group_by: ['...']
  #         group_wait: 1s
  #         group_interval: 1s
  #         repeat_interval: 4h
  #         continue: true
  #   receivers:
  #     - name: nudgebee-agent
  #       webhook_configs:
  #         - url: http://<release>-runner.<agent-namespace>.svc/api/alerts
  #           send_resolved: true
  #
  # `continue: true` keeps your existing receivers working; without it the first
  # matching route wins and PagerDuty/Slack stop seeing alerts. group_by ['...']
  # means do not aggregate -- NudgeBee correlates alerts itself and pre-grouping
  # discards the detail it correlates on.
  #
  # A PLAIN AlertmanagerConfig CR IN THIS NAMESPACE DOES NOT WORK.
  # prometheus-operator defaults alertmanagerConfigMatcherStrategy to
  # `OnNamespace`, which injects a namespace=<the CR's namespace> matcher into
  # every route it generates. An AlertmanagerConfig in the agent's namespace
  # therefore forwards only alerts from that one namespace -- partial delivery
  # that reads as "mostly working" rather than as a misconfiguration.
  #
  # Two CR-based arrangements DO route cluster-wide:
  #   - alertmanagerConfigMatcherStrategy `OnNamespaceExceptForAlertmanagerNamespace`
  #     (prometheus-operator v0.84.0+) with the AlertmanagerConfig created in the
  #     ALERTMANAGER's namespace, not the agent's; or
  #   - spec.alertmanagerConfiguration.name on the Alertmanager, pointing at an
  #     AlertmanagerConfig in its own namespace, which the operator uses as the
  #     base config without enforcing a namespace label on its routes.
  # Not `None`: that drops the namespace restriction for every AlertmanagerConfig
  # in the cluster, not just ours.
  #
  # ALERTMANAGER OUTSIDE THIS CLUSTER (Grafana Cloud, Chronosphere, a central
  # one elsewhere): a ClusterIP URL is unreachable from there. Use the public
  # webhook instead -- NudgeBee UI -> Admin -> Integrations -> Prometheus
  # AlertManager Webhook, then POST to
  # https://<your-host>/api/webhooks/prometheus-alertmanager with
  # `Authorization: Bearer <token>`.
  #
  # VERIFYING: `amtool config routes show` proves the route loaded, and an alert
  # firing in Alertmanager's own UI showing up in NudgeBee proves delivery.
  # Alertmanager stops at the first matching route unless it sets
  # `continue: true`, so a route above this one can swallow the alerts.
  # `AlertmanagerFailedToSendAlerts` means the receiver URL is wrong or blocked.
  # To test the intake alone, port-forward the runner Service and POST an
  # Alertmanager v4 payload to /api/alerts; it answers 202 once it reads the
  # body and forwards asynchronously, so check the runner logs alongside it.
  # Extra alternation terms appended to the container-id exclusion regex of the
  # default alert rules (both the log-error and HTTP-failure rules). Terms match
  # as substrings of container_id (/k8s/<namespace>/<pod>/<container>), so a
  # namespace name excludes that whole namespace.
  # e.g. for clusters running demo/synthetic-load apps that fail on purpose:
  # extra_rule_exclusions: ["demo", "nb-bench"]
  extra_rule_exclusions: []
  # OPT-IN: keep_firing_for for the flap-prone rules (HighErrorCriticalLogs,
  # ApplicationAPIFailures): an intermittently failing target stays one steady
  # alert instead of resolving and re-firing on every dip below threshold.
  # Off by default for provider compatibility — Prometheus < 2.42 REJECTS rule
  # files containing this field (taking down every rule in the group), and
  # other PrometheusRule consumers (VictoriaMetrics operator < v0.46, older
  # rulers) silently drop or reject it. Only set this (e.g. "10m") when every
  # rule evaluator in the target cluster is known to support keep_firing_for.
  rule_keep_firing_for: ""
