{{- /*
Identities for the pods the runner starts: script pods (pod_script_run_enricher)
and scan Jobs (schedule_k8s_job). Their image and script are chosen by the
caller, so they do not run as the runner's own service account.

  - <fullname>-script: script pods by default.
  - <fullname>-scanner: every scan Job.
    Both are bound to <fullname>-script-scanner-read: cluster-wide
    get/list/watch (the same rules as the read-only runner role), no Secrets,
    no write verbs, no exec.
  - <fullname>-script-write: only with runner.scriptPods.allowWrite. Bound to
    the runner's own ClusterRole, used only for a script request that asks for
    write access and carries a valid relay signature.

None of them carries runner.serviceAccount.annotations, so cloud workload
identity bound to the runner is not handed to script or scanner code. All carry
the runner's imagePullSecrets so private script and scanner images still pull.
*/}}
{{- $fullname := include "nudgebee-agent.fullname" . }}
{{- $pullSecrets := include "nudgebee-agent.imagePullSecrets" (dict "secrets" .Values.runnerServiceAccount.imagePullSecrets "root" .) }}
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $fullname }}-script-scanner-read
rules:
{{- include "nudgebee-agent.readOnlyClusterRules" . }}

  # Read-only forms of reads the standard runner role grants together with
  # writes, so scanners (popeye, trivy) read the same objects in both modes.
  - apiGroups:
      - ""
    resources:
      - resourcequotas
      - limitranges
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - statefulsets/scale
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - argoproj.io
    resources:
      - rollouts/scale
    verbs:
      - get
      - list
      - watch

{{- include "nudgebee-agent.openshiftReadOnlyClusterRules" . }}
{{- range $sa := list "script" "scanner" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-{{ $sa }}
  namespace: {{ $.Release.Namespace }}
{{- with $pullSecrets }}
{{ . }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-{{ $sa }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-script-scanner-read
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-{{ $sa }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- if .Values.runner.scriptPods.allowWrite }}
{{- if .Values.runner.readOnly }}
{{- fail "runner.readOnly=true is incompatible with runner.scriptPods.allowWrite=true — a read-only runner has no write rights to hand to script pods" }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-script-write
  namespace: {{ .Release.Namespace }}
{{- with $pullSecrets }}
{{ . }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-script-write
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-runner-cluster-role
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-script-write
    namespace: {{ .Release.Namespace }}
{{- end }}
