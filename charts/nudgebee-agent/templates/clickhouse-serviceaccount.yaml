{{- /*
ServiceAccount of the bundled ClickHouse. Same name and token setting as the
Bitnami subchart rendered.
*/ -}}
{{- if include "nudgebee-agent.clickhouse.installed" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nudgebee-agent.clickhouse.servicename" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "nudgebee-agent.clickhouse.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
