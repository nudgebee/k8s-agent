{{- /*
ServiceAccount of the bundled ClickHouse, same name as the Bitnami subchart
rendered. ClickHouse never calls the Kubernetes API, so no token is mounted (the
subchart mounted one). The setting is on the ServiceAccount, not in the
StatefulSet's pod template, so changing it does not restart the pod.
*/ -}}
{{- if include "nudgebee-agent.clickhouse.installed" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nudgebee-agent.clickhouse.servicename" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "nudgebee-agent.clickhouse.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
