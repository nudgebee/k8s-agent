{{- /*
Route Alertmanager at this agent's own /api/alerts intake.

WHY THIS EXISTS
The only thing that wires Alertmanager to the agent today is
extra-scrape-config.yaml, which is a values file for kube-prometheus-stack and
therefore cannot template anything. It hardcodes

    http://nudgebee-agent-runner.nudgebee-agent.svc/api/alerts

while this chart names the Service {{ include "nudgebee-agent.fullname" . }}-runner
in {{ .Release.Namespace }}. Those agree ONLY when the release is called exactly
`nudgebee-agent` in a namespace called `nudgebee-agent`. Any other name and
Alertmanager POSTs to a host that does not resolve, every alert is dropped, and
nothing anywhere reports an error -- the agent simply looks like it is missing
alerts. Verified on a real cluster: a release in namespace `nudgebee-lab` sent
every alert into a black hole until the URL was corrected.

It also leaves out everyone who ALREADY runs Prometheus. Those installs never
pass -f extra-scrape-config.yaml -- the docs tell them they only need the
Prometheus URL, which is true for metrics because the runner queries them, but
it means nothing ever configures their Alertmanager. That is the normal state of
any established cluster adopting NudgeBee.

Rendering the receiver from the chart fixes both: the chart knows its own
release name and namespace, and it is installed regardless of how Prometheus got
there.

OFF BY DEFAULT, DELIBERATELY
Installs that already followed extra-scrape-config.yaml have a working receiver.
Adding a second one would duplicate every alert rather than fix anything, so this
is opt-in. NOTES.txt prints the correct URL for the current release either way,
so an operator wiring it by hand has the right value in front of them.

PICKUP IS NOT AUTOMATIC -- SET THE LABELS
kube-prometheus-stack only adopts AlertmanagerConfig objects matching its
alertmanagerConfigSelector, which defaults to its own Helm release name, and by
default only from the Alertmanager's own namespace unless
alertmanagerConfigNamespaceSelector is set. This chart cannot know either value.
If the object is created and alerts still do not arrive, that selector is the
first thing to check -- it fails the same silent way as the hardcoded URL.
*/ -}}
{{- if .Values.alertmanager.createAlertmanagerConfig }}
{{- if or .Values.enablePrometheusStack (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1alpha1/AlertmanagerConfig") }}
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: {{ include "nudgebee-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nudgebee-agent.labels" . | nindent 4 }}
    component: alertmanager-config
    {{- with .Values.alertmanager.alertmanagerConfigLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  route:
    receiver: nudgebee-agent
    {{- /*
      groupBy ['...'] means "do not aggregate". NudgeBee's triage collapses
      related alerts itself using the knowledge graph, so pre-grouping here
      throws away the per-alert detail it correlates on. The short intervals
      exist for the same reason: batching delays delivery without reducing
      what the agent has to reason about.
    */}}
    groupBy: {{ .Values.alertmanager.routeGroupBy | toJson }}
    groupWait: {{ .Values.alertmanager.routeGroupWait | quote }}
    groupInterval: {{ .Values.alertmanager.routeGroupInterval | quote }}
    repeatInterval: {{ .Values.alertmanager.routeRepeatInterval | quote }}
    {{- /*
      continue: true so this route never swallows alerts that other receivers
      (PagerDuty, Slack) are also meant to get. Without it the first matching
      route wins and everything downstream stops seeing them.
    */}}
    continue: true
    {{- with .Values.alertmanager.routeMatchers }}
    matchers:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  receivers:
    - name: nudgebee-agent
      webhookConfigs:
        - url: http://{{ include "nudgebee-agent.fullname" . }}-runner.{{ .Release.Namespace }}.svc/api/alerts
          {{- /*
            sendResolved so the agent can close events instead of leaving them
            firing until they age out.
          */}}
          sendResolved: true
{{- end }}
{{- end }}
