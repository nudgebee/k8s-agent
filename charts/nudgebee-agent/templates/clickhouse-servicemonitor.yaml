{{- /*
The ClickHouse scrape target. It carries the same CRD gate as the chart's other
monitoring CRs: the ServiceMonitor CRD is registered, or enablePrometheusStack
asserts it for offline render. Without the gate a cluster with no Prometheus
operator fails the install on an unregistered CRD.

Every clickhouse.metrics.serviceMonitor.* field the Bitnami subchart honoured
(namespace, labels, annotations, selector, jobLabel, honorLabels, relabelings)
is honoured here too, and name, namespace and spec match what earlier charts
rendered, so an upgrade updates the existing object in place — including one
that set a `release:` label for kube-prometheus-stack's selector. It also carries
prometheusStack.selectorLabels like the chart's other monitoring CRs, and
honours enableServiceMonitors. clickhouse.metrics.serviceMonitor.enabled, which
turned on the subchart's own copy in earlier charts, now renders this one.
*/ -}}
{{- $ch := .Values.clickhouse -}}
{{- $otel := index (default (dict) (index .Values "opentelemetry-collector")) "enabled" -}}
{{- if and $otel $ch.metrics.enabled (or (and .Values.enableServiceMonitors $ch.nudgebeeServiceMonitor.enabled) $ch.metrics.serviceMonitor.enabled) (or .Values.enablePrometheusStack (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor")) }}
{{- $sm := $ch.metrics.serviceMonitor }}
{{- $name := default "clickhouse" $ch.nameOverride | trunc 63 | trimSuffix "-" }}
{{- $ns := default .Release.Namespace $ch.namespaceOverride | trunc 63 | trimSuffix "-" }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "nudgebee-agent.clickhouse.servicename" . }}
  namespace: {{ default $ns $sm.namespace | quote }}
  {{- /* One map, so a key set in two places renders once. Later wins: the
  installer-detected Prometheus selector labels (as on this chart's other
  monitoring CRs), then commonLabels, then serviceMonitor.labels. */}}
  {{- $labels := dict "app.kubernetes.io/name" $name "app.kubernetes.io/instance" .Release.Name "app.kubernetes.io/managed-by" .Release.Service "app.kubernetes.io/component" "clickhouse" }}
  {{- $labels = mustMergeOverwrite $labels (default (dict) (fromYaml (include "nudgebee-agent.prometheusSelectorLabels" .))) }}
  {{- with $ch.commonLabels }}
  {{- $labels = mustMergeOverwrite $labels (fromYaml (tpl (toYaml .) $)) }}
  {{- end }}
  {{- with $sm.labels }}
  {{- $labels = mustMergeOverwrite $labels (fromYaml (tpl (toYaml .) $)) }}
  {{- end }}
  labels: {{- toYaml $labels | nindent 4 }}
  annotations:
    {{- with $ch.commonAnnotations }}
    {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
    {{- with $sm.annotations }}
    {{- tpl (toYaml .) $ | nindent 4 }}
    {{- end }}
spec:
  {{- /* "" was the Bitnami subchart's default; without it this rendered null. */}}
  jobLabel: {{ $sm.jobLabel | default "" | quote }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      {{- with $sm.selector }}
      {{- tpl (toYaml .) $ | nindent 6 }}
      {{- end }}
  endpoints:
    - port: http-metrics
      path: "/metrics"
      {{- with $sm.interval }}
      interval: {{ . }}
      {{- end }}
      {{- with $sm.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
      {{- with $sm.honorLabels }}
      honorLabels: {{ . }}
      {{- end }}
      {{- with $sm.metricRelabelings }}
      metricRelabelings: {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
      {{- with $sm.relabelings }}
      relabelings: {{- tpl (toYaml .) $ | nindent 8 }}
      {{- end }}
  namespaceSelector:
    matchNames:
    - {{ $ns | quote }}
{{- end }}
