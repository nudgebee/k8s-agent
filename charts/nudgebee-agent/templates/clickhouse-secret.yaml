{{- /*
The ClickHouse admin password, under admin-password. Not rendered when
clickhouse.auth.existingSecret names a Secret the operator manages.

Password, in order:
  1. the one already in this Secret, so an upgrade never changes it;
  2. clickhouse.auth.password;
  3. a random one.
The Bitnami subchart failed step 3 on an upgrade ("PASSWORDS ERROR: You must
provide your current passwords when upgrading the release"), which broke every
upgrade that turned ClickHouse on.

`helm template` and client-side dry runs cannot look the Secret up, so they
render step 2 or 3.
*/ -}}
{{- if and (include "nudgebee-agent.clickhouse.installed" .) (not (dig "auth" "existingSecret" "" .Values.clickhouse)) }}
{{- $name := include "nudgebee-agent.clickhouse.servicename" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $password := "" }}
{{- if hasKey $existing "admin-password" }}
{{- $password = index $existing "admin-password" }}
{{- else if .Values.clickhouse.auth.password }}
{{- $password = .Values.clickhouse.auth.password | toString | b64enc }}
{{- else }}
{{- $password = randAlphaNum 16 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "nudgebee-agent.clickhouse.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ $password | quote }}
{{- end }}
