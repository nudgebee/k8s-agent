{{- /*
ClickHouse Services. Names, ports and selector are what the Bitnami subchart
rendered: the runner, the collector and the ServiceMonitor reach ClickHouse
through them.
*/ -}}
{{- if include "nudgebee-agent.clickhouse.installed" . }}
{{- $fullname := include "nudgebee-agent.clickhouse.servicename" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-headless
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "nudgebee-agent.clickhouse.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      targetPort: http
      port: 8123
      protocol: TCP
    - name: tcp
      targetPort: tcp
      port: 9000
      protocol: TCP
    - name: tcp-mysql
      targetPort: tcp-mysql
      port: 9004
      protocol: TCP
    - name: tcp-postgresql
      targetPort: tcp-postgresql
      port: 9005
      protocol: TCP
    - name: http-intersrv
      targetPort: http-intersrv
      port: 9009
      protocol: TCP
  selector:
    {{- include "nudgebee-agent.clickhouse.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "nudgebee-agent.clickhouse.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
    - name: http
      targetPort: http
      port: 8123
      protocol: TCP
    - name: tcp
      targetPort: tcp
      port: 9000
      protocol: TCP
    - name: tcp-mysql
      targetPort: tcp-mysql
      port: 9004
      protocol: TCP
    - name: tcp-postgresql
      targetPort: tcp-postgresql
      port: 9005
      protocol: TCP
    - name: http-intersrv
      targetPort: http-intersrv
      port: 9009
      protocol: TCP
    {{- if .Values.clickhouse.metrics.enabled }}
    - name: http-metrics
      targetPort: http-metrics
      port: 8001
      protocol: TCP
    {{- end }}
  selector:
    {{- include "nudgebee-agent.clickhouse.selectorLabels" . | nindent 4 }}
{{- end }}
