apiVersion: v2
name: nudgebee-agent
description: NudgeBee Kubernetes agent — connects your cluster to the NudgeBee backend for observability, cost, and incident automation.
type: application
icon: https://nudgebee-documents.s3.amazonaws.com/images/Nudgebee-logo.png
home: https://github.com/nudgebee/k8s-agent
sources:
  - https://github.com/nudgebee/k8s-agent
maintainers:
  - name: NudgeBee
    email: support@nudgebee.com
    url: https://nudgebee.com
keywords:
  - kubernetes
  - observability
  - opentelemetry
  - opencost
  - monitoring
  - clickhouse
  - kubewatch
  - sre
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://app.nudgebee.com/help/docs/installation/agent/installation/
    - name: Source
      url: https://github.com/nudgebee/k8s-agent
# version and appVersion MUST stay identical. The agent reports appVersion to the
# server as RUNNER_VERSION (see _helpers.tpl), and the server compares that
# against the newest released *chart* version to decide whether to show "Please
# update your agent version" in the UI. Let them drift and every up-to-date
# cluster is told, permanently, to upgrade to a version it already runs.
# release-rc.yaml stamps both for RCs; release.yaml uses whatever is committed
# here, so a GA release ships exactly these two lines. helm-dev-lint.yml fails
# the PR if they differ.
version: 0.1.24
appVersion: 0.1.24
dependencies:
- name: opencost
  version: 2.0.1
  condition: opencost.enabled
  repository: "https://opencost.github.io/opencost-helm-chart"
- name: clickhouse
  version: 3.1.*
  repository: https://charts.bitnami.com/bitnami
  condition: opentelemetry-collector.enabled
- name: opentelemetry-collector
  version: 0.165.0
  repository: https://open-telemetry.github.io/opentelemetry-helm-charts
  condition: opentelemetry-collector.enabled
