prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 50Gi
    additionalScrapeConfigs: |
      - job_name: opencost
        honor_labels: true
        scrape_interval: 1m
        scrape_timeout: 10s
        metrics_path: /metrics
        scheme: http
        dns_sd_configs:
        - names:
          - opencost.opencost
          type: 'A'
          port: 9003
      - job_name: 'nudgebee-node-agent'
        honor_labels: true
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [ __meta_kubernetes_pod_annotation_prometheus_io_scrape ]
            action: keep
            regex: true
          - source_labels: [ __meta_kubernetes_pod_annotation_prometheus_io_scrape_slow ]
            action: drop
            regex: true
          - source_labels: [ __meta_kubernetes_pod_label_app]
            action: keep
            regex: nudgebee-node-agent
          - source_labels: [ __meta_kubernetes_pod_annotation_prometheus_io_scheme ]
            action: replace
            regex: (https?)
            target_label: __scheme__
          - source_labels: [ __meta_kubernetes_pod_annotation_prometheus_io_path ]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [ __address__, __meta_kubernetes_pod_annotation_prometheus_io_port ]
            action: replace
            regex: (.+?)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [ __meta_kubernetes_pod_phase ]
            regex: Pending|Succeeded|Failed|Completed
            action: drop
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance
            action: replace
# node-exporter defaults to hostPort 9100 with host networking. On any cluster
# that already runs a node-exporter -- a previous kube-prometheus-stack, or a
# VictoriaMetrics stack, both common -- that port is taken on every node and
# every pod of this DaemonSet sits Pending with "didn't have free ports". The
# nodeExporter.service.targetPort flag in the install docs does NOT fix this: it
# changes the Service only, not the host binding.
#
# Using the pod network instead avoids the collision entirely. node-exporter
# still reports host metrics -- those come from the /proc and /sys host mounts,
# not from host networking.
prometheus-node-exporter:
  hostNetwork: false
  service:
    port: 9101
    targetPort: 9101

alertmanager:
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: [ 'namespace' ]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        - receiver: 'null'
          matchers:
            - alertname =~ "InfoInhibitor|Watchdog"
          continue: true
        - receiver: 'nudgebee-agent'
          group_by: [ '...' ]
          group_wait: 1s
          group_interval: 1s
          matchers:
            - severity =~ ".*"
          repeat_interval: 4h
          continue: true #
    receivers:
      - name: 'null'
      - name: 'nudgebee-agent'
        webhook_configs:
          # NOTE: this URL is hardcoded because a values file cannot template.
          # It resolves ONLY when the agent release is named `nudgebee-agent` in
          # a namespace called `nudgebee-agent`. Any other name and alerts are
          # POSTed into a black hole, silently -- nothing logs an error.
          #
          # For any other layout, or if you already had Prometheus and therefore
          # never used this file, let the agent chart emit the receiver instead:
          #   --set alertmanager.createAlertmanagerConfig=true
          #   --set alertmanager.alertmanagerConfigLabels.release=<kps release>
          # The chart knows its own release name, so the URL is always right.
          - url: 'http://nudgebee-agent-runner.nudgebee-agent.svc/api/alerts'
            send_resolved: true
grafana:
  enabled: true
  adminPassword: 'admin'
  adminUser: 'admin'
  grafana.ini:
    security:
      allow_embedding: true
