# This rule is not used by the project nudgebee-agent-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over agent.nudgebee.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: nudgebee-agent-operator
    app.kubernetes.io/managed-by: kustomize
  name: nudgebeeagent-admin-role
rules:
- apiGroups:
  - agent.nudgebee.com
  resources:
  - nudgebeeagents
  verbs:
  - '*'
- apiGroups:
  - agent.nudgebee.com
  resources:
  - nudgebeeagents/status
  verbs:
  - get
