# This rule is not used by the project nudgebee-agent-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the agent.nudgebee.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: nudgebee-agent-operator
    app.kubernetes.io/managed-by: kustomize
  name: nudgebeeagent-editor-role
rules:
- apiGroups:
  - agent.nudgebee.com
  resources:
  - nudgebeeagents
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - agent.nudgebee.com
  resources:
  - nudgebeeagents/status
  verbs:
  - get
