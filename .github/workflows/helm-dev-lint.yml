# CI Workflow for Agent Helm chart
name: Helm Lint (dev)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main"]
  # Required check for main; it has to report on merge-queue runs too or every
  # queue entry waits on it forever.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Add dependency chart repos
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add opencost https://opencost.github.io/opencost-helm-chart
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo add bitnami https://charts.bitnami.com/bitnami

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (lint)
        run: ct lint --debug --config ./.github/configs/ct.yaml --lint-conf ./.github/configs/lintconf.yaml --check-version-increment=false

      # The agent reports appVersion to the server as RUNNER_VERSION, and the
      # server compares it against the newest released *chart* version to decide
      # whether to show "Please update your agent version". A PR that bumps
      # version without appVersion ships a chart that under-reports itself, so
      # every cluster on the newest chart is told forever to upgrade to what it
      # already runs — and upgrading changes nothing, so it never clears.
      - name: Assert Chart version and appVersion match
        run: |
          version=$(yq '.version' charts/nudgebee-agent/Chart.yaml)
          app_version=$(yq '.appVersion' charts/nudgebee-agent/Chart.yaml)
          if [ "$version" != "$app_version" ]; then
            echo "::error file=charts/nudgebee-agent/Chart.yaml::version ($version) != appVersion ($app_version) — bump both together, or the agent reports $app_version while the release is $version."
            exit 1
          fi
          echo "ok: version == appVersion == $version"

      - name: Build chart dependencies
        run: helm dependency build charts/nudgebee-agent

      - name: Render templates
        run: |
          helm template nudgebee-agent charts/nudgebee-agent --namespace nudgebee-agent > /tmp/rendered.yaml
          # Subchart-conditioned resources are the usual source of dangling
          # references, so render the collector-off variant too and check it.
          helm template nudgebee-agent charts/nudgebee-agent --namespace nudgebee-agent \
            --set opentelemetry-collector.enabled=false > /tmp/rendered-no-otel.yaml

      # Guards a whole bug class: a workload referencing a Secret/ConfigMap the
      # release does not create. kubelet cannot resolve the reference, so the pod
      # never starts — it sits in phase Pending with CreateContainerConfigError,
      # which reads as "stuck Pending" to operators. It bit us when the runner
      # kept a hard secretKeyRef to the ClickHouse Secret while the ClickHouse
      # subchart is conditioned on opentelemetry-collector.enabled.
      - name: Assert no workload references a Secret/ConfigMap the release omits
        run: |
          pip install pyyaml
          python - /tmp/rendered.yaml /tmp/rendered-no-otel.yaml <<'PY'
          import sys, yaml

          POD_OWNERS = {'Deployment', 'DaemonSet', 'StatefulSet', 'Job', 'CronJob', 'ReplicaSet'}
          failed = False

          for path in sys.argv[1:]:
              docs = [d for d in yaml.safe_load_all(open(path)) if d]
              created = {(d['kind'], d['metadata']['name'])
                         for d in docs if d.get('kind') in ('Secret', 'ConfigMap')}
              missing = []

              def check(kind, name, where, optional):
                  # An optional reference is a deliberate "may not exist" — the
                  # pod starts either way, so it is not a dangling reference.
                  if not optional and (kind, name) not in created:
                      missing.append(f'{where} -> missing {kind}/{name}')

              def walk_pod(owner, spec):
                  for c in (spec.get('containers') or []) + (spec.get('initContainers') or []):
                      for e in c.get('env') or []:
                          vf = e.get('valueFrom') or {}
                          for key, kind in (('secretKeyRef', 'Secret'), ('configMapKeyRef', 'ConfigMap')):
                              if ref := vf.get(key):
                                  check(kind, ref['name'],
                                        f"{owner} container/{c['name']} env/{e['name']}", ref.get('optional'))
                      for ef in c.get('envFrom') or []:
                          for key, kind in (('secretRef', 'Secret'), ('configMapRef', 'ConfigMap')):
                              if ref := ef.get(key):
                                  check(kind, ref['name'],
                                        f"{owner} container/{c['name']} envFrom", ref.get('optional'))
                  for v in spec.get('volumes') or []:
                      if 'secret' in v:
                          check('Secret', v['secret']['secretName'],
                                f"{owner} volume/{v['name']}", v['secret'].get('optional'))
                      if 'configMap' in v:
                          check('ConfigMap', v['configMap']['name'],
                                f"{owner} volume/{v['name']}", v['configMap'].get('optional'))

              for d in docs:
                  if d.get('kind') not in POD_OWNERS:
                      continue
                  spec = d['spec']
                  tmpl = spec.get('template') or (spec.get('jobTemplate') or {}).get('spec', {}).get('template')
                  if tmpl:
                      walk_pod(f"{d['kind']}/{d['metadata']['name']}", tmpl['spec'])

              if missing:
                  failed = True
                  print(f'FAIL {path}:')
                  for m in sorted(missing):
                      print(f'  {m}')
              else:
                  print(f'ok: {path} has no dangling Secret/ConfigMap references')

          sys.exit(1 if failed else 0)
          PY

      # Guards a Helm footgun: the opentelemetry-collector subchart puts
      # memory_limiter first in each of its default pipelines, but Helm replaces
      # lists instead of merging them, so any processors list we override in
      # values.yaml silently drops it. Without it the collector has no admission
      # backpressure and OOMKills under load.
      - name: Assert memory_limiter is first in every collector pipeline
        run: |
          pip install pyyaml
          python - <<'PY'
          import sys, yaml

          docs = [d for d in yaml.safe_load_all(open('/tmp/rendered.yaml')) if d]
          relay = next(
              (d['data']['relay'] for d in docs
               if d.get('kind') == 'ConfigMap' and 'relay' in (d.get('data') or {})),
              None,
          )
          if relay is None:
              sys.exit('no opentelemetry-collector config ConfigMap in rendered output')

          pipelines = yaml.safe_load(relay)['service']['pipelines']
          bad = [n for n, p in pipelines.items()
                 if (p.get('processors') or [None])[0] != 'memory_limiter']
          if bad:
              sys.exit(f'memory_limiter missing or not first in pipeline(s): {", ".join(sorted(bad))}')
          print(f'ok: memory_limiter first in {len(pipelines)} pipeline(s)')
          PY

      # global.storageClass / clickhouse.persistence.storageClass work only
      # because the Bitnami common helper reads them, and the chart tracks
      # `clickhouse 3.1.*` with a floating patch. Pin the three semantics the
      # README documents rather than trusting a subchart bump not to change them.
      - name: Assert the StorageClass values reach the ClickHouse PVC
        run: |
          assert() { # <expected-storageClassName-line-or-empty> <helm-args...>
            expected="$1"; shift
            if ! rendered="$(helm template nudgebee-agent charts/nudgebee-agent --namespace nudgebee-agent "$@")"; then
              echo "helm template $*: render failed"
              exit 1
            fi
            actual="$(printf '%s\n' "$rendered" | grep 'storageClassName' | tr -d ' ' || true)"
            if [ "$actual" != "$expected" ]; then
              echo "helm template $*: expected [$expected], got [$actual]"
              exit 1
            fi
          }
          assert ''                              # default: key omitted, cluster default provisions
          assert 'storageClassName:ci-global' --set global.storageClass=ci-global
          assert 'storageClassName:ci-local' --set clickhouse.persistence.storageClass=ci-local
          assert 'storageClassName:ci-global' --set global.storageClass=ci-global --set clickhouse.persistence.storageClass=ci-local
          assert 'storageClassName:""' --set global.storageClass=- --set clickhouse.persistence.storageClass=ci-local
          echo 'ok: storageClass precedence and "-" handling intact'

      # The runner's ClickHouse logs check must look where the bundled exporter
      # writes. With the collector off nothing is set and the runner falls back
      # to otel_logs in CLICKHOUSE_DB; an operator's own env var wins.
      - name: Assert the runner's ClickHouse logs table follows the exporter
        run: |
          assert() { # <expected-env-lines> <helm-args...>
            expected="$1"; shift
            if ! rendered="$(helm template nudgebee-agent charts/nudgebee-agent --namespace nudgebee-agent "$@")"; then
              echo "helm template $*: render failed"
              exit 1
            fi
            actual="$(printf '%s\n' "$rendered" | grep -A1 'name: CLICKHOUSE_LOGS_' | grep -v '^--$' | tr -d ' ' | paste -sd' ' -)"
            if [ "$actual" != "$expected" ]; then
              echo "helm template $*: expected [$expected], got [$actual]"
              exit 1
            fi
          }
          assert '-name:CLICKHOUSE_LOGS_DATABASE value:"default" -name:CLICKHOUSE_LOGS_TABLE value:"otel_logs"'
          assert '-name:CLICKHOUSE_LOGS_DATABASE value:"telemetry" -name:CLICKHOUSE_LOGS_TABLE value:"app_logs"' \
            --set opentelemetry-collector.config.exporters.clickhouse.database=telemetry \
            --set opentelemetry-collector.config.exporters.clickhouse.logs_table_name=app_logs
          assert '' --set opentelemetry-collector.enabled=false
          assert '-name:CLICKHOUSE_LOGS_DATABASE value:"default" -name:CLICKHOUSE_LOGS_TABLE value:mine' \
            --set 'runner.additional_env_vars[0].name=CLICKHOUSE_LOGS_TABLE' \
            --set 'runner.additional_env_vars[0].value=mine'
          echo 'ok: CLICKHOUSE_LOGS_DATABASE / CLICKHOUSE_LOGS_TABLE follow the exporter config'

      # query_data reads through a read-only user with query limits. The user
      # exists only in the bundled ClickHouse, so the runner names it only when
      # that is where it connects, and the users file is mounted where the
      # image copies users.d overrides from.
      - name: Assert the read-only ClickHouse user for query_data
        run: |
          render() { helm template nudgebee-agent charts/nudgebee-agent --namespace nudgebee-agent "$@"; }
          reader_env() { printf '%s\n' "$1" | grep -A1 'name: CLICKHOUSE_READER_USER' | grep -v '^--$' | tr -d ' ' | paste -sd' ' -; }
          fail() { echo "$*"; exit 1; }

          out="$(render)"
          [ "$(reader_env "$out")" = '-name:CLICKHOUSE_READER_USER value:nudgebee_reader' ] || fail "default: runner lacks CLICKHOUSE_READER_USER"
          printf '%s\n' "$out" | python3 -c '
          import sys, yaml
          docs = [d for d in yaml.safe_load_all(sys.stdin) if d]
          cm = next(d for d in docs if d["kind"] == "ConfigMap" and d["metadata"]["name"] == "nudgebee-agent-clickhouse-reader-users")
          xml = cm["data"]["nudgebee-reader.xml"]
          for want in ("<readonly>2</readonly>", "<password from_env=\"CLICKHOUSE_ADMIN_PASSWORD\"/>", "<max_execution_time><min>1</min><max>600</max></max_execution_time>", "<profile>nudgebee_reader</profile>", "<query>GRANT SELECT, SHOW ON *.*</query>", "<max_bytes_before_external_group_by>500000000</max_bytes_before_external_group_by>"):
              assert want in xml, want
          sts = next(d for d in docs if d["kind"] == "StatefulSet" and d["metadata"]["name"].startswith("nudgebee-agent-clickhouse-shard"))
          pod = sts["spec"]["template"]["spec"]
          vol = next(v for v in pod["volumes"] if v["name"] == "nudgebee-reader-users")
          assert vol["configMap"]["name"] == cm["metadata"]["name"], vol
          mounts = [m for c in pod["containers"] for m in c.get("volumeMounts") or [] if m["name"] == "nudgebee-reader-users"]
          assert [m["mountPath"] for m in mounts] == ["/bitnami/clickhouse/etc/users.d/nudgebee-reader"], mounts
          '

          [ -z "$(reader_env "$(render --set clickhouse.reader.enabled=false)")" ] || fail "reader disabled: runner still names it"
          [ -z "$(reader_env "$(render --set opentelemetry-collector.enabled=false)")" ] || fail "no bundled ClickHouse: runner still names the reader"
          [ -z "$(reader_env "$(render --set 'runner.additional_env_vars[0].name=CLICKHOUSE_HOST' --set 'runner.additional_env_vars[0].value=ch.example')")" ] \
            || fail "external CLICKHOUSE_HOST: runner still names the reader"
          # --reuse-values from a release without clickhouse.reader, or a custom
          # clickhouse.extraVolumes without the reader mount: no user, no ConfigMap.
          for args in '--set clickhouse.reader=null' '--set clickhouse.extraVolumes[0].name=certs --set clickhouse.extraVolumes[0].emptyDir.medium=Memory'; do
            out="$(render $args)" || fail "$args: render failed"
            [ -z "$(reader_env "$out")" ] || fail "$args: runner names the reader without its mount"
            if printf '%s\n' "$out" | grep -q 'name: nudgebee-agent-clickhouse-reader-users'; then fail "$args: reader ConfigMap rendered"; fi
          done
          echo 'ok: query_data reads through the read-only ClickHouse user'

      # logs.collection is the one switch for where container logs go. node-agent
      # points the node-agent's log push at the bundled collector and is the only
      # thing that makes the runner report clickhouseLogsCollected. A value it
      # can't honour fails the render instead of reporting logs nobody collects.
      # NODE_NAME is set in node-agent mode only, so other modes keep the
      # node-agent pod spec as it was. The collector's logs pipeline drops
      # kube-system and the release namespace.
      - name: Assert the logs collection switch
        run: |
          assert() { # <expected-env-lines> <helm-args...>
            expected="$1"; shift
            if ! rendered="$(helm template nudgebee-agent charts/nudgebee-agent --namespace nudgebee-agent "$@")"; then
              echo "helm template $*: render failed"
              exit 1
            fi
            actual="$(printf '%s\n' "$rendered" | grep -A1 -e 'name: LOGS_ENDPOINT' -e 'name: NODE_NAME' -e 'name: CLICKHOUSE_LOGS_COLLECTED' | grep -v '^--$' | tr -d ' ' | paste -sd' ' -)"
            if [ "$actual" != "$expected" ]; then
              echo "helm template $*: expected [$expected], got [$actual]"
              exit 1
            fi
          }
          refuses() { # <message-fragment> <helm-args...>
            want="$1"; shift
            if out="$(helm template nudgebee-agent charts/nudgebee-agent --namespace nudgebee-agent "$@" 2>&1)"; then
              echo "helm template $*: rendered; expected it to fail with [$want]"
              exit 1
            fi
            case "$out" in *"$want"*) ;; *) echo "helm template $*: failed with [$out], expected [$want]"; exit 1 ;; esac
          }
          assert ''
          assert '' --set logs.collection=
          assert '' --set logs.collection=none
          assert '-name:LOGS_ENDPOINT value:"http://nudgebee-agent-opentelemetry-collector:4318/v1/logs" -name:NODE_NAME valueFrom: -name:CLICKHOUSE_LOGS_COLLECTED value:"true"' \
            --set logs.collection=node-agent
          # An operator's own endpoint is theirs: nothing claims the logs reach ClickHouse.
          assert '-name:LOGS_ENDPOINT value:"http://loki:3100/otlp/v1/logs"' --set nodeAgent.logsEndpoint=http://loki:3100/otlp/v1/logs
          refuses 'set opentelemetry-collector.enabled=true' --set logs.collection=node-agent --set opentelemetry-collector.enabled=false
          refuses 'needs nodeAgent.enabled=true' --set logs.collection=node-agent --set nodeAgent.enabled=false
          refuses 'unset nodeAgent.logsEndpoint' --set logs.collection=node-agent --set nodeAgent.logsEndpoint=http://x:4318/v1/logs
          refuses 'remove LOGS_ENDPOINT from nodeAgent.env' --set logs.collection=node-agent \
            --set 'nodeAgent.env[0].name=LOGS_ENDPOINT' --set 'nodeAgent.env[0].value=http://loki:3100/otlp/v1/logs'
          refuses 'otel-daemonset is not available yet' --set logs.collection=otel-daemonset
          refuses 'must be none or node-agent' --set logs.collection=loki
          printf '%s\n' "$(helm template nudgebee-agent charts/nudgebee-agent --namespace nudgebee-agent --set logs.collection=node-agent)" | grep -A3 'name: NODE_NAME' | grep -q 'fieldPath: spec.nodeName' \
            || { echo 'node-agent NODE_NAME is not spec.nodeName'; exit 1; }
          # The subchart runs tpl over its config, which fills in the release namespace.
          rendered="$(helm template nudgebee-agent charts/nudgebee-agent --namespace ci-logs --set logs.collection=node-agent)"
          printf '%s\n' "$rendered" | grep -qF 'resource.attributes["k8s.namespace.name"] == "ci-logs"' \
            || { echo 'filter/drop_log_namespaces does not drop the release namespace'; exit 1; }
          printf '%s\n' "$rendered" | grep -q -- '- filter/drop_log_namespaces$' \
            || { echo 'filter/drop_log_namespaces is not in the logs pipeline'; exit 1; }
          echo 'ok: logs.collection sets the node-agent endpoint, NODE_NAME and clickhouseLogsCollected together'

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

      - name: Validate rendered templates
        run: |
          kubeconform \
            -strict \
            -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -skip SecurityContextConstraints \
            /tmp/rendered.yaml /tmp/rendered-no-otel.yaml
