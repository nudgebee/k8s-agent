# CI Workflow for Agent Helm chart
name: Helm Lint (dev)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Add dependency chart repos
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add opencost https://opencost.github.io/opencost-helm-chart
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo add bitnami https://charts.bitnami.com/bitnami

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.14.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (lint)
        run: ct lint --debug --config ./.github/configs/ct.yaml --lint-conf ./.github/configs/lintconf.yaml --check-version-increment=false

      - name: Build chart dependencies
        run: helm dependency build charts/nudgebee-agent

      - name: Render templates
        run: helm template nudgebee-agent charts/nudgebee-agent --namespace nudgebee-agent > /tmp/rendered.yaml

      # Guards a Helm footgun: the opentelemetry-collector subchart puts
      # memory_limiter first in each of its default pipelines, but Helm replaces
      # lists instead of merging them, so any processors list we override in
      # values.yaml silently drops it. Without it the collector has no admission
      # backpressure and OOMKills under load.
      - name: Assert memory_limiter is first in every collector pipeline
        run: |
          pip install pyyaml
          python - <<'PY'
          import sys, yaml

          docs = [d for d in yaml.safe_load_all(open('/tmp/rendered.yaml')) if d]
          relay = next(
              (d['data']['relay'] for d in docs
               if d.get('kind') == 'ConfigMap' and 'relay' in (d.get('data') or {})),
              None,
          )
          if relay is None:
              sys.exit('no opentelemetry-collector config ConfigMap in rendered output')

          pipelines = yaml.safe_load(relay)['service']['pipelines']
          bad = [n for n, p in pipelines.items()
                 if (p.get('processors') or [None])[0] != 'memory_limiter']
          if bad:
              sys.exit(f'memory_limiter missing or not first in pipeline(s): {", ".join(sorted(bad))}')
          print(f'ok: memory_limiter first in {len(pipelines)} pipeline(s)')
          PY

      # Guards a values/template desync: prometheus-alert-rule.yaml compiles the
      # rules' exclusion matchers from alertmanager.defaultRuleExclusions, and
      # emits NO matcher when the lists are empty. #553 moved the previously
      # hardcoded lists into values and left the key undefined, so every 0.1.x
      # rendered rules that alerted on every container in the cluster --
      # including the agent's own -- and helm lint/template/kubeconform all
      # passed. This asserts behaviour, not just presence, so a future edit that
      # loosens a boundary (e.g. "otel" starting to swallow "hotel-service")
      # fails here too.
      - name: Assert default alert rules carry their exclusion matchers
        run: |
          python - <<'PY'
          import re, sys, yaml

          docs = [d for d in yaml.safe_load_all(open('/tmp/rendered.yaml')) if d]
          rules = {
              r['alert']: r['expr']
              for d in docs if d.get('kind') == 'PrometheusRule'
              for g in d['spec']['groups'] for r in g.get('rules', [])
              if 'alert' in r
          }
          for alert in ('HighErrorCriticalLogs', 'ApplicationAPIFailures'):
              if alert not in rules:
                  sys.exit(f'{alert} missing from rendered output')

          log_excl = re.findall(r'container_id!~"([^"]*)"', rules['HighErrorCriticalLogs'])
          api_excl = re.findall(r'destination_workload_namespace!~"([^"]*)"', rules['ApplicationAPIFailures'])
          if not log_excl:
              sys.exit('HighErrorCriticalLogs renders with no container_id exclusion')
          if not api_excl:
              sys.exit('ApplicationAPIFailures renders with no namespace exclusion')

          # PromQL =~/!~ are fully anchored, so fullmatch mirrors the evaluator.
          def excluded(cid):
              return any(re.fullmatch(p, cid) for p in set(log_excl))

          cases = [
              ('/k8s/nudgebee-agent/runner-1/runner', True),
              ('/k8s/nudgebee-agent-dev/nb-node-agent-x/node-agent', True),  # -suffix variant
              ('/k8s/kube-system/calico-node-x/calico-node', True),
              ('/k8s/loki/loki-0/loki', True),
              ('/k8s/otel/otel-collector-1/collector', True),
              ('/system.slice/containerd.service', True),
              ('/k8s-cronjob/kube-system/job-x/job', True),
              ('/k8s/nudgebee/services-server-abc/services-server', False),
              ('/k8s/demo/hotel-service-1/hotel-service', False),  # "otel" must not match
          ]
          bad = [(c, w) for c, w in cases if excluded(c) != w]
          if bad:
              sys.exit('exclusion regex misclassified:\n' + '\n'.join(
                  f'  {c} -- expected excluded={w}, got {not w}' for c, w in bad))
          print(f'ok: {len(cases)} exclusion cases classified correctly')
          PY

      # global.storageClass / clickhouse.persistence.storageClass work only
      # because the Bitnami common helper reads them, and the chart tracks
      # `clickhouse 3.1.*` with a floating patch. Pin the three semantics the
      # README documents rather than trusting a subchart bump not to change them.
      - name: Assert the StorageClass values reach the ClickHouse PVC
        run: |
          assert() { # <expected-storageClassName-line-or-empty> <helm-args...>
            expected="$1"; shift
            if ! rendered="$(helm template nudgebee-agent charts/nudgebee-agent --namespace nudgebee-agent "$@")"; then
              echo "helm template $*: render failed"
              exit 1
            fi
            actual="$(printf '%s\n' "$rendered" | grep 'storageClassName' | tr -d ' ' || true)"
            if [ "$actual" != "$expected" ]; then
              echo "helm template $*: expected [$expected], got [$actual]"
              exit 1
            fi
          }
          assert ''                              # default: key omitted, cluster default provisions
          assert 'storageClassName:ci-global' --set global.storageClass=ci-global
          assert 'storageClassName:ci-local' --set clickhouse.persistence.storageClass=ci-local
          assert 'storageClassName:ci-global' --set global.storageClass=ci-global --set clickhouse.persistence.storageClass=ci-local
          assert 'storageClassName:""' --set global.storageClass=- --set clickhouse.persistence.storageClass=ci-local
          echo 'ok: storageClass precedence and "-" handling intact'

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

      - name: Validate rendered templates
        run: |
          kubeconform \
            -strict \
            -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -skip SecurityContextConstraints \
            /tmp/rendered.yaml
