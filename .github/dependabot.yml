version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    groups:
      # init, analyze and upload-sarif must run the same version; bumped
      # separately, each PR fails CodeQL until the last one lands.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker

  # Runner component (Go binary + its Dockerfile)
  - package-ecosystem: docker
    directory: /runner
    schedule:
      interval: weekly
    labels:
      - dependencies
      - docker

  - package-ecosystem: gomod
    directory: /runner
    schedule:
      interval: weekly
    labels:
      - dependencies
      - go
    groups:
      # k8s.io modules only build against each other at the same minor, and
      # controller-runtime pins that minor too.
      kubernetes:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
